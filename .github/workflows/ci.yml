name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - run: uv sync --frozen
      - run: uv run ruff check .
      # DB가 필요한 테스트는 Postgres가 없으면 건너뛴다(원본 데이터가 저장소에 없다).
      - run: uv run pytest -q

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pharma-scm-agent:ci .
