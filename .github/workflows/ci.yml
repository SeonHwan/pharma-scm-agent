name: ci

on:
  push:
  pull_request:

jobs:
  # 린트와 테스트. 환경 준비(Postgres, uv, 의존성, DB 복원)는 재사용 워크플로 _checks.yml이 한다.
  test:
    uses: ./.github/workflows/_checks.yml
    with:
      run_tests: true

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pharma-scm-agent:ci .
