name: deploy

# 테스트와 스모크 평가 게이트를 통과한 뒤 이미지를 빌드해 ECR에 올리고 ECS 서비스를 갱신한다.
# 시작하는 방법은 두 가지다.
#  - master에 push: 이미지에 들어가는 파일(src, pyproject.toml, uv.lock, Dockerfile)이 바뀐 경우만. 저장소 변수
#    DEPLOY_ENABLED가 true일 때만 실행한다. 서비스가 떠 있어야 배포할 대상이 있고(과금 자원은 필요할 때만 올린다),
#    꺼져 있을 때 push마다 평가(LLM 호출)가 돌고 배포가 실패하는 것을 막는다.
#  - 수동 실행: 비용 승인 체크가 있어야 시작한다.
on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
  workflow_dispatch:
    inputs:
      approve_cost:
        description: "평가 게이트가 LLM을 약 10회 호출한다(입력 약 2.5만 토큰). 비용을 승인하면 체크"
        type: boolean
        default: false

# 같은 서비스에 배포가 동시에 둘 돌지 않게 한다. 진행 중인 배포는 취소하지 않는다(중간에 끊으면 서비스 상태가 어중간해진다).
concurrency:
  group: deploy
  cancel-in-progress: false

# 기본 권한은 저장소 읽기만이다. AWS 역할을 맡는 job에만 id-token: write를 따로 준다.
permissions:
  contents: read

jobs:
  # 배포 전 관문: 린트·테스트와 스모크 평가 게이트를 재사용 워크플로 _checks.yml로 돌린다(ci.yml, eval-smoke.yml과 같은 틀).
  # 이 job이 실패하거나 실행되지 않으면 아래 deploy job은 실행되지 않는다.
  gate:
    # master가 아니면 건너뛴다(배포 역할은 master 토큰만 맡을 수 있다). push는 DEPLOY_ENABLED가 true일 때만,
    # 수동 실행은 비용 승인 체크가 있을 때만 시작한다. 건너뛰면 아래 deploy job도 실행되지 않는다.
    if: >-
      github.ref == 'refs/heads/master' &&
      ((github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.approve_cost))
    uses: ./.github/workflows/_checks.yml
    with:
      run_tests: true
      run_smoke: true
      run_prefix: gate
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  # 이미지를 ECR에 올리고 ECS 서비스를 새 이미지로 갱신한다. gate가 통과한 경우에만 실행된다.
  deploy:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # job에 permissions를 쓰면 워크플로 기본값을 대체한다. 그래서 contents: read를 다시 적는다.
    # id-token: write는 GitHub이 이 job에 OIDC 토큰을 발급하게 하는 권한이다(AWS 역할을 맡는 job에만 준다).
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
    steps:
      - uses: actions/checkout@v4

      # GitHub이 발급한 토큰을 AWS STS에 보내 역할을 맡고, 임시 자격을 이 job의 환경변수로 받는다.
      # 역할 ARN에는 계정 ID가 들어 있어 파일에 적지 않고 저장소 변수(vars.AWS_ROLE_ARN)에서 읽는다.
      - name: AWS 역할 맡기(OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 위에서 받은 임시 자격으로 ECR에 docker login을 한다. 출력 registry가 다음 단계의 이미지 주소가 된다.
      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 이미지 이름은 `레지스트리/저장소:태그`다. 태그는 커밋 해시 앞 7자리로, 지금까지 올린 태그(ea13c2a 형식)와 같다.
      # ECR 저장소의 태그가 불변이라 같은 커밋을 두 번 push하면 실패한다(재실행하려면 새 커밋이 필요하다).
      # 러너는 x86_64라서 태스크 정의의 cpu_architecture(X86_64)와 맞는다. 값은 run 안에서 환경변수로 쓴다.
      - name: 이미지 빌드와 push
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="${REGISTRY}/pharma-scm-agent:${GITHUB_SHA::7}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "uri=${IMAGE}" >> "$GITHUB_OUTPUT"

      # 지금 등록된 태스크 정의(최신 리비전)를 파일로 받는다. 새 리비전은 이 내용에서 이미지만 바꿔 만든다.
      - name: 현재 태스크 정의 받기
        run: |
          aws ecs describe-task-definition --task-definition pharma-scm-agent \
            --query taskDefinition > task-definition.json

      # 컨테이너 api의 image 값만 방금 push한 주소로 바꾼 파일을 만든다(AWS 호출 없음, 파일만 수정).
      - name: 이미지 교체
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: api
          image: ${{ steps.image.outputs.uri }}

      # 교체한 내용을 새 리비전으로 등록하고, 서비스 pharma-api가 그 리비전을 쓰게 바꾼 뒤 안정될 때까지 기다린다.
      # 새 태스크가 헬스 체크를 통과하지 못하면 서비스의 서킷 브레이커가 직전 리비전으로 되돌린다(8-4에서 확인).
      - name: 서비스 배포
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: pharma-api
          cluster: pharma-cluster
          wait-for-service-stability: true
