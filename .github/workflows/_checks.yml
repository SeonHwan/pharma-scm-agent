name: checks

# 다른 워크플로가 `uses:`로 부르는 재사용 워크플로(직접 실행되지 않는다). ci.yml의 테스트, eval-smoke.yml의 스모크 평가,
# deploy.yml의 배포 전 관문이 같은 환경 준비(Postgres, uv, 의존성, DB 복원)를 반복하던 것을 한 곳에 모았다.
# 부르는 쪽이 입력으로 무엇을 돌릴지 고른다.
on:
  workflow_call:
    inputs:
      run_tests:
        description: "ruff와 pytest를 실행한다"
        type: boolean
        default: false
      run_smoke:
        description: "스모크 평가(LLM 약 10회 호출)와 게이트 판정을 실행한다"
        type: boolean
        default: false
      run_prefix:
        description: "평가 실행 ID와 결과 보관 이름의 접두어(smoke, gate 등)"
        type: string
        default: checks
    secrets:
      ANTHROPIC_API_KEY:
        description: "스모크 평가가 쓰는 키. 테스트만 돌릴 때는 필요 없다"
        required: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RUN_ID: ${{ inputs.run_prefix }}_${{ github.sha }}
    # config.py 기본 DSN(localhost:5433)과 맞춘 Postgres. 테스트와 에이전트 도구가 실제 DB를 조회한다.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pharma_admin
          POSTGRES_PASSWORD: local-dev-only
          POSTGRES_DB: pharma
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pharma_admin -d pharma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - run: uv sync --frozen
      - name: 린트
        if: inputs.run_tests
        run: uv run ruff check .
      - run: scripts/ci_restore_db.sh
      # DB가 필요한 테스트는 Postgres에 접속하지 못하면 건너뛴다(로컬에서 DB 없이 돌릴 때).
      - name: 테스트
        if: inputs.run_tests
        run: uv run pytest -q
      # 문항 6개(eval/smoke_ids.txt). 실행 중 예외로 실패한 문항이 있으면 --strict가 여기서 멈춘다.
      - name: 스모크 평가 실행
        if: inputs.run_smoke
        run: uv run python -m pharma_scm.evalset.run_eval --run-id "$RUN_ID" --ids "$(cat eval/smoke_ids.txt)" --strict
      - name: 집계
        if: inputs.run_smoke
        run: uv run python -m pharma_scm.evalset.report "$RUN_ID" --json "data/runs/$RUN_ID/summary.json"
      # 안전·정답률·형식·비용을 eval/baseline.json 기준으로 판정한다. 실패하면 이 job이 실패한다.
      - name: 게이트 판정
        if: inputs.run_smoke
        run: uv run python -m pharma_scm.evalset.gate "data/runs/$RUN_ID/summary.json"
      - name: 결과 보관
        if: always() && inputs.run_smoke
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.run_prefix }}-${{ github.sha }}
          path: data/runs/${{ env.RUN_ID }}
          retention-days: 14
