name: eval-smoke

# 프롬프트·에이전트·평가 코드·평가 재료를 바꾼 PR만 스모크 평가(6문항)를 돌려 게이트로 판정한다. 실제 LLM을 호출한다.
on:
  pull_request:
    paths:
      - "src/pharma_scm/agent/**"
      - "src/pharma_scm/evalset/**"
      - "eval/**"
      - "scripts/ci_restore_db.sh"
      - "deploy/pharma.sql.gz"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/eval-smoke.yml"

# 같은 PR에 새 커밋이 오면 이전 실행을 취소해 불필요한 호출을 막는다.
concurrency:
  group: eval-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    # fork PR에는 시크릿이 전달되지 않는다. 키가 없어서 실패하는 대신 실행하지 않는다.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RUN_ID: smoke_${{ github.sha }}
    # ci.yml의 test job과 같은 Postgres(config.py 기본 DSN과 맞춤). 에이전트 도구가 실제 DB를 조회한다.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pharma_admin
          POSTGRES_PASSWORD: local-dev-only
          POSTGRES_DB: pharma
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pharma_admin -d pharma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - run: uv sync --frozen
      - run: scripts/ci_restore_db.sh
      # 문항 6개(eval/smoke_ids.txt). 실행 중 예외로 실패한 문항이 있으면 --strict가 여기서 멈춘다.
      - name: 스모크 실행
        run: uv run python -m pharma_scm.evalset.run_eval --run-id "$RUN_ID" --ids "$(cat eval/smoke_ids.txt)" --strict
      - name: 집계
        run: uv run python -m pharma_scm.evalset.report "$RUN_ID" --json "data/runs/$RUN_ID/summary.json"
      # 안전·정답률·형식·비용을 eval/baseline.json 기준으로 판정한다. 실패하면 이 job이 실패한다.
      - name: 게이트 판정
        run: uv run python -m pharma_scm.evalset.gate "data/runs/$RUN_ID/summary.json"
      - name: 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ github.sha }}
          path: data/runs/${{ env.RUN_ID }}
          retention-days: 14
