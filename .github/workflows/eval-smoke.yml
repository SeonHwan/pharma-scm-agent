name: eval-smoke

# 프롬프트·에이전트·평가 코드·평가 재료를 바꾼 PR만 스모크 평가(6문항)를 돌려 게이트로 판정. 실제 LLM을 호출.
on:
  pull_request:
    paths:
      - "src/pharma_scm/agent/**"
      - "src/pharma_scm/evalset/**"
      - "src/pharma_scm/retrieval/**"
      - "sop/**"
      - "eval/**"
      - "scripts/ci_restore_db.sh"
      - "deploy/pharma.sql.gz"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/eval-smoke.yml"
      - ".github/workflows/_checks.yml"

# 같은 PR에 새 커밋이 오면 이전 실행을 취소해 불필요한 호출을 방지.
concurrency:
  group: eval-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 환경 준비와 평가 단계는 재사용 워크플로 _checks.yml이 담당(run_smoke: 스모크 6문항 평가, 집계, 게이트 판정, 결과 보관).
  smoke:
    # fork PR에는 시크릿이 전달되지 않음. 키가 없어서 실패하는 대신 실행하지 않음.
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/_checks.yml
    with:
      run_smoke: true
      run_prefix: smoke
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
