name: eval-full

# 수동 전체 평가(114문항). 실제 LLM을 호출한다: 1회 약 58.7만 입력 토큰, 호출 약 225회(v1 실측).
# eval/baseline.json의 임계치는 스모크 6문항용이라 여기서는 게이트를 적용하지 않는다. 집계와 결과를 보관하고,
# 기준선 갱신 PR의 근거로 쓴다(docs/eval_protocol.md, docs/ci_eval_gate_plan.md).
on:
  workflow_dispatch:
    inputs:
      approve_cost:
        description: "전체 평가는 LLM을 약 225회 호출한다(입력 약 58.7만 토큰). 비용을 승인하면 체크"
        type: boolean
        default: false

# 전체 평가가 동시에 둘 돌지 않게 한다. 진행 중인 것은 취소하지 않는다.
concurrency:
  group: eval-full
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  full:
    # 비용 승인 체크가 없으면 실행하지 않는다.
    if: inputs.approve_cost
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RUN_ID: full_${{ github.sha }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pharma_admin
          POSTGRES_PASSWORD: local-dev-only
          POSTGRES_DB: pharma
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pharma_admin -d pharma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - run: uv sync --frozen
      - run: scripts/ci_restore_db.sh
      - name: 전체 평가 실행
        run: uv run python -m pharma_scm.evalset.run_eval --run-id "$RUN_ID" --strict
      - name: 집계
        run: |
          uv run python -m pharma_scm.evalset.report "$RUN_ID" --json "data/runs/$RUN_ID/summary.json" > report.txt
          cat report.txt
          { echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-${{ github.sha }}
          path: data/runs/${{ env.RUN_ID }}
          retention-days: 30
