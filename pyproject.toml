[project]
name = "pharma-scm-agent"
version = "0.1.0"
description = "제약 SCM 재고·결품 질의 에이전트 (합성 데이터 기반)"
requires-python = "==3.13.*"
dependencies = [
    "fastapi==0.162.0",
    "langchain-anthropic==1.7.9",
    "langgraph==1.2.19",
    "psycopg[binary]==3.2.9",
    "python-dotenv==1.2.4",
    "sqlglot==30.27.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.1",
    "ruff==0.12.4",
]
gen = [
    "openai==3.59.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = "pharma_scm"
